[project]
name = "lab5"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zaytsev Artem", email = "zajtsev.artjom@samlit.net" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"


[tool.uv.build-backend]
module-root = "source"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "plotly>=7.1.0",
    "ruff>=0.17.1",
]

[project.scripts]
main = "lab5.main:main"
