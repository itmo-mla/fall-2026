[project]
name = "lab3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zaytsev Artem", email = "zajtsev.artjom@samlit.net" }
]
requires-python = ">=3.14"
dependencies = [
    "kagglehub>=1.0.2",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
main = "lab3.main:main"
